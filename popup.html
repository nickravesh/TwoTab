<!DOCTYPE html>
<html lang="en" dir="auto" data-theme="winter">
<head>
  <meta charset="UTF-8">
  <title>TwoTab</title>
  <link href="daisyui.css" rel="stylesheet" type="text/css" />
  <style>
    /* Set a fixed size for the popup body */
    body {
      width: 420px;
    }
  </style>
</head>
<body class="bg-base-200 p-4">
  <main>
    <h2 class="text-xl font-bold text-center text-base-content mb-4">TwoTab</h2>
    
    <div class="grid grid-cols-2 gap-2 mb-4">
        <button id="saveTabs" class="btn btn-primary btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
            Save Tabs
        </button>
        <button id="viewAll" class="btn btn-sm">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
            View All
        </button>
    </div>
    
    <input id="search" type="text" placeholder="Search saved tabs..." class="input input-sm input-bordered w-full mb-4" aria-label="Search saved tabs" />
    
    <div id="groups" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
    <div id="popup-limit-warning" class="text-xs text-center text-base-content text-opacity-50 mt-2 hidden">
      Showing only the 10 most recent groups. Click 'View All' to see all.
    </div>
    
    <div class="flex justify-center gap-2 mt-4 pt-4 border-t border-base-300">
      <button id="import" class="btn btn-xs" aria-label="Import tabs from file">Import</button>
      <button id="exportAll" class="btn btn-xs" aria-label="Export all tabs">Export</button>
      <button id="clearAll" class="btn btn-xs btn-error btn-outline" aria-label="Clear all saved tabs">Clear All</button>
    </div>
  </main>

  <dialog id="rename-modal" class="modal">
    <div class="modal-box">
      <h3 class="font-bold text-lg">Rename Group</h3>
      <p class="py-4">Enter a new name for this tab group.</p>
      <input id="rename-input" type="text" placeholder="New group name" class="input input-bordered w-full" />
      <div class="modal-action">
        <form method="dialog" class="flex gap-2">
          <button class="btn">Cancel</button>
          <button id="rename-save-btn" class="btn btn-primary">Save</button>
        </form>
      </div>
    </div>
  </dialog>

  <script src="utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
