<!DOCTYPE html>
<html lang="en" dir="auto" data-theme="winter">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TwoTab - All Saved Tabs</title>
  <link href="daisyui.css" rel="stylesheet" type="text/css" />
</head>
<body class="bg-base-200 min-h-screen p-4 sm:p-6 md:p-10">
  <main class="max-w-6xl w-full mx-auto flex flex-col items-center">
    <h1 class="text-3xl font-bold text-center text-base-content mb-10">TwoTab - All Saved Tabs</h1>
    <input id="search" type="text" placeholder="Search tabs by title or URL..." class="input input-bordered w-full max-w-5xl mb-10 shadow-sm" aria-label="Search saved tabs" />
    <div class="flex justify-center gap-4 mb-10 flex-wrap">
      <button id="saveTabs" class="btn btn-primary" aria-label="Save current tabs">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
        Save Current Tabs
      </button>
      <button id="import" class="btn" aria-label="Import tabs from file">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
        Import
      </button>
      <button id="exportAll" class="btn" aria-label="Export all tabs">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
        Export All
      </button>
      <button id="clearAll" class="btn btn-error btn-outline" aria-label="Clear all saved tabs">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
        Clear All
      </button>
    </div>
    <div id="groups" class="w-full flex flex-col items-center space-y-4"></div>
  </main>

  <dialog id="rename-modal" class="modal">
    <div class="modal-box">
      <h3 class="font-bold text-lg">Rename Group</h3>
      <p class="py-4">Enter a new name for this tab group.</p>
      <input id="rename-input" type="text" placeholder="New group name" class="input input-bordered w-full" />
      <div class="modal-action">
        <form method="dialog" class="flex gap-2">
          <button class="btn">Cancel</button>
          <button id="rename-save-btn" class="btn btn-primary">Save</button>
        </form>
      </div>
    </div>
  </dialog>

  <script src="tabs.js"></script>
</body>
</html>
