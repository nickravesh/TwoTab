<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <style>
      :root {
        --bg: #090d16;
        --fg: #f8fafc;
        --accent: #6366f1;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        cursor: pointer;
        user-select: none;
      }
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        opacity: 0.9;
        text-align: center;
        padding: 2rem;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .status-text {
        font-size: 0.875rem;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.02em;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="loader-container">
      <div class="spinner"></div>
      <div class="status-text" id="statusText">Opening webpage...</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
